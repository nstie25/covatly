<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cơ Vật Lý - Remote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="remote-card">
        <!-- Logo Công ty -->
        <div class="logo-container">
            <img src="logo.png" alt="Cơ Vật Lý Logo" class="logo-img">
        </div>
        <h1 class="brand-title">CƠ VẬT LÝ </h1>

        <!-- Lưới 4 nút điều khiển chính -->
        <div class="btn-grid">
            <button class="btn btn-phoi" onclick="sendCmd('PHOI')">
                <span class="icon">☀️</span>
                <span>Phơi</span>
            </button>
            <button class="btn btn-thu" onclick="sendCmd('THU')">
                <span class="icon">🌧️</span>
                <span>Thu</span>
            </button>
            <button class="btn btn-auto" onclick="sendCmd('AUTO')">
                <span class="icon">🔄</span>
                <span>Tự động</span>
            </button>
            <button class="btn btn-home" onclick="window.location.href='/home'">
                <span class="icon">🏠</span>
                <span>Home</span>
            </button>
        </div>

        <!-- Nút STOP -->
        <button class="btn btn-stop" onclick="sendCmd('STOP')">
            <span class="icon">⏹️</span>
            <span>STOP</span>
        </button>
    </div>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.sendCmd = function(cmd) {
            set(ref(db, 'control/command'), cmd);
        };
    </script>
</body>
</html>
